<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SPHAERA Threads OAuth Callback</title>
  <meta name="robots" content="noindex, nofollow">
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#090806;color:#f3ead3;font-family:system-ui,-apple-system,Segoe UI,sans-serif;line-height:1.5}
    main{max-width:720px;padding:32px}
    code{word-break:break-all;color:#d8b76a}
    .box{border:1px solid rgba(216,183,106,.35);border-radius:18px;padding:24px;background:rgba(255,255,255,.03)}
  </style>
</head>
<body>
  <main class="box">
    <h1>Threads-Verbindung</h1>
    <p>Diese Seite empfängt die OAuth-Rückleitung für SPHAERA.</p>
    <p>Wenn in der Adresszeile ein Parameter <code>?code=...</code> steht, kopiere bitte die vollständige URL und speichere sie lokal in <code>/home/domi/.config/sphaera/threads.env</code> als <code>THREADS_REDIRECT_RESULT_URL</code>.</p>
    <p id="status"></p>
  </main>
  <script>
    const params = new URLSearchParams(location.search);
    const status = document.getElementById('status');
    if (params.get('code')) {
      status.innerHTML = 'OAuth-Code empfangen. Du kannst jetzt die vollständige URL aus der Adresszeile kopieren.';
    } else if (params.get('error')) {
      status.innerHTML = 'OAuth-Fehler: <code>' + params.get('error') + '</code>';
    } else {
      status.textContent = 'Kein OAuth-Code in der URL gefunden.';
    }
  </script>
</body>
</html>
